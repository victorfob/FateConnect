name: Publish

# Chamado pelo `release.yml` para produção e pelo `deploy.yml` para homologação.
# Um arquivo só para que os dois subam pelos mesmos passos — deploy que difere
# entre ambientes deixa de valer como ensaio.
#
# O front é construído AQUI, e é este `dist` que vai para a VPS: é o que mantém
# os source maps do Sentry descrevendo o bundle que está no ar. Reconstruir no
# servidor produziria outro bundle, e o erro apontaria a linha errada.
on:
  workflow_call:
    inputs:
      environment:
        description: hml ou prod
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest

    # É o ambiente do GitHub que separa variáveis e segredos dos dois destinos.
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.PUBLIC_URL }}

    env:
      # O sshd descarta conexão nova quando a fila de preauth está cheia
      # (`MaxStartups`), e numa máquina exposta à internet ela vive cheia de
      # tentativa de força bruta. Insistir no connect transforma o descarte em
      # alguns segundos de atraso em vez de publicação reprovada.
      SSH_OPTIONS: -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: FateConnect/Web/.nvmrc
          cache: yarn
          cache-dependency-path: FateConnect/Web/yarn.lock

      # `--ignore-scripts` porque instalar dependência não deve executar código:
      # sem ele o `postinstall` de qualquer pacote da árvore roda no runner, com
      # os segredos do job ao alcance.
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts
        working-directory: FateConnect/Web

      # É ela que amarra o erro no Sentry à release que o produziu.
      - name: Read version
        id: version
        run: echo "value=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      # Sem o token o plugin do Sentry se desliga e o build segue.
      - name: Build the front
        run: yarn build
        working-directory: FateConnect/Web
        env:
          VITE_API_URL: ${{ vars.PUBLIC_URL }}/api
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_RELEASE: v${{ steps.version.outputs.value }}

      - name: Load the deploy key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # A identidade do servidor vem fixada em secret. O `ssh-keyscan` que
          # ficava aqui abria uma conexão por tipo de chave, em paralelo, e as
          # três disputavam a fila de preauth justamente antes de o deploy
          # precisar dela.
          if [[ -z "$DEPLOY_KNOWN_HOSTS" ]]; then
            echo "Falta o secret DEPLOY_KNOWN_HOSTS. Veja 'A identidade do servidor' em deploy/README.md." >&2
            exit 1
          fi
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Send the front to the VPS
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          # Quem serve estes arquivos é o nginx do host; a pasta nasce no
          # install-site.sh, com dono no usuário do deploy.
          target="/var/www/fateconnect/${{ inputs.environment }}"
          # --delete: sem ele, arquivo apagado no código segue servido no ar.
          rsync -az --delete \
            -e "ssh $SSH_OPTIONS" \
            FateConnect/Web/dist/ \
            "$DEPLOY_USER@$DEPLOY_HOST:$target/"

      - name: Publish
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh $SSH_OPTIONS \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH/deploy' && ./deploy.sh '${{ inputs.environment }}'"

      - name: Check that the environment answers
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh $SSH_OPTIONS \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker ps --filter 'name=fateconnect-${{ inputs.environment }}' --filter 'status=running' --format '{{.Names}}'" \
            > containers.txt
          echo 'No ar:'; cat containers.txt
          # Um ambiente é um contêiner, o da API: banco e servidor web são do
          # host e não aparecem aqui.
          total=$(grep -c . containers.txt || true)
          if [[ "$total" -lt 1 ]]; then
            echo "ERRO: nenhum contêiner de pé; esperado 1." >&2
            exit 1
          fi

          # Contêiner de pé não prova aplicação viva. Em 08/09/2026 este passo
          # ficou verde com a API caindo em laço por erro de migration: ele roda
          # logo depois do `up -d`, e pegou o contêiner na primeira execução,
          # antes de a exceção matá-lo — é corrida, não cegueira. Quem morreu e
          # voltou tem `RestartCount` acima de zero, e o `up -d` zera o contador
          # ao recriar o contêiner, então aqui zero é o único valor aceitável.
          reinicios=$(ssh $SSH_OPTIONS "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker inspect -f '{{.RestartCount}}' '$(head -1 containers.txt)'")
          echo "Reinícios desde a subida: $reinicios"
          if [[ "$reinicios" -gt 0 ]]; then
            echo "ERRO: o contêiner reiniciou $reinicios vez(es) desde a subida; a aplicação não está estável." >&2
            exit 1
          fi

          # E contêiner estável ainda não prova que o nginx alcança a
          # aplicação: a mesma queda devolvia 502 aqui. Qualquer caminho sob
          # `/api/` responde quando a aplicação está servindo, porque a
          # fallback policy do `Program.cs` atende requisição que não casa
          # endpoint nenhum — por isso a sonda não cita rota de produto, e o
          # que se cobra é ter havido resposta, não um código específico.
          sonda="${{ vars.PUBLIC_URL }}/api/__deploy_probe"
          for tentativa in $(seq 1 20); do
            codigo=$(curl -s -o /dev/null -m 10 -w '%{http_code}' "$sonda") || codigo=000
            case "$codigo" in
              000|502|503|504) echo "  tentativa $tentativa: $codigo"; sleep 6 ;;
              *) break ;;
            esac
          done
          case "$codigo" in
            000|502|503|504)
              echo "ERRO: a aplicação não respondeu em 2min; último código: $codigo." >&2
              exit 1 ;;
          esac
          echo "A aplicação respondeu $codigo."

      - name: Remove the deploy key
        if: always()
        run: rm -f ~/.ssh/deploy_key
