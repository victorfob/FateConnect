name: Warm front cache

# ⛔ Escrita de cache num run de `pull_request` fica presa em
# `refs/pull/N/merge`, e um PR não lê o do outro. Este job grava na `develop`,
# que é o escopo que os PRs enxergam; sem ele todo PR instalaria a frio.
on:
  push:
    branches: [develop]

# Sem cancelamento: um merge que cancela o aquecimento do anterior deixa o cache
# sem gravar, que é justamente o que este workflow existe para impedir.
concurrency:
  group: warm-front-cache

permissions:
  contents: read

jobs:
  warm:
    name: Warm front cache
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FateConnect/Web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: FateConnect/Web/.nvmrc

      # O Yarn do projeto vem pelo Corepack: o Yarn 1 do runner recusa instalar.
      - name: Enable Corepack
        run: corepack enable

      # A chave e o prefixo são os mesmos do `check-front.yml`: chave diferente
      # aqui grava um cache que os PRs não acham, e o workflow inteiro vira ruído.
      - uses: actions/cache@v4
        with:
          path: FateConnect/Web/node_modules
          key: node-modules-${{ hashFiles('FateConnect/Web/yarn.lock') }}
          restore-keys: node-modules-

      # Instalar dependência não deve executar código: sem `--mode=skip-build` o
      # `postinstall` de qualquer pacote da árvore roda com os segredos do job
      # ao alcance.
      - name: Install dependencies
        run: yarn install --immutable --mode=skip-build
