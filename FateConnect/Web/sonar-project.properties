sonar.projectKey=fateconnect_FateConnect
sonar.organization=fateconnect

# Caminhos relativos a este arquivo: o workflow passa projectBaseDir=FateConnect/Web.
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx

# Espelha o recorte de cobertura do Vitest em vite.config.ts — o que a suíte não
# mede de propósito não pode contar como descoberto aqui.
sonar.coverage.exclusions=src/main.tsx,src/test/**,src/vite-env.d.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=coverage/sonar-report.xml
sonar.sourceEncoding=UTF-8

# Reprova o job de CI quando o quality gate reprova. Sem isto o scan publica o
# resultado no Sonar e sai verde, e o limite de duplicação não bloqueia nada.
sonar.qualitygate.wait=true
