<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Caminho absoluto: sem `<base>`, um href relativo viraria
         `/caronas/favicon.ico` nas rotas aninhadas. -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
    <!-- Quem entende SVG prefere este, e é ele que clareia a roda quando a aba
         é escura — o `.ico` é um raster só e não acompanha o esquema. -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- Título padrão, para a primeira passada do rastreador: cada rota declara
         o seu em `routes/pageMetadata.ts`, e o React 19 insere o dela ANTES
         deste, que é o que faz a da rota valer. Um teste reprova se este texto
         deixar de ser o da landing.
         ⛔ E não há `meta description` aqui de propósito. Medido no navegador:
         o React insere `<meta>` no FIM do `<head>`, não no começo como faz com
         o `<title>` — então uma description estática ficaria à frente da que a
         rota declara e venceria, servindo o texto da landing em `/cadastro`. -->
    <title>FateConnect | Caronas e achados e perdidos da Fatec</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
