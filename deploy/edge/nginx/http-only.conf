# Primeira fase: sem certificado ainda. Serve para os ambientes subirem e para o
# Let's Encrypt conseguir validar os dois domínios.

server {
    listen 80 default_server;
    server_name ${DOMAIN_PROD};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # O nome do ambiente é resolvido a cada requisição, e não na subida: assim a
    # borda sobe antes dos ambientes e sobrevive à queda de um deles — quem
    # estiver fora devolve 502 no seu próprio domínio, sem derrubar o vizinho.
    resolver 127.0.0.11 valid=10s;
    set $upstream_prod http://web-prod;

    location / {
        proxy_pass $upstream_prod$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name ${DOMAIN_HML};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # O nome do ambiente é resolvido a cada requisição, e não na subida: assim a
    # borda sobe antes dos ambientes e sobrevive à queda de um deles — quem
    # estiver fora devolve 502 no seu próprio domínio, sem derrubar o vizinho.
    resolver 127.0.0.11 valid=10s;
    set $upstream_hml http://web-hml;

    location / {
        proxy_pass $upstream_hml$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
