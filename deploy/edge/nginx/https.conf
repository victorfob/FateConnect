# Segunda fase: HTTPS nos dois ambientes. O nginx só sobe com este arquivo
# depois que o enable-https.sh emitiu os dois certificados — se faltar um, ele
# não encontra o arquivo e recusa a subir.

server {
    listen 80 default_server;
    server_name ${DOMAIN_PROD} ${DOMAIN_HML};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name ${DOMAIN_PROD};

    ssl_certificate /etc/letsencrypt/live/${DOMAIN_PROD}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN_PROD}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # O nome do ambiente é resolvido a cada requisição, e não na subida: assim a
    # borda sobe antes dos ambientes e sobrevive à queda de um deles — quem
    # estiver fora devolve 502 no seu próprio domínio, sem derrubar o vizinho.
    resolver 127.0.0.11 valid=10s;
    set $upstream_prod http://web-prod;

    location / {
        proxy_pass $upstream_prod$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${DOMAIN_HML};

    ssl_certificate /etc/letsencrypt/live/${DOMAIN_HML}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN_HML}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Homologação não deve aparecer em busca: é a mesma aplicação com outros
    # dados, e indexá-la confunde quem procura o site de verdade.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # O nome do ambiente é resolvido a cada requisição, e não na subida: assim a
    # borda sobe antes dos ambientes e sobrevive à queda de um deles — quem
    # estiver fora devolve 502 no seu próprio domínio, sem derrubar o vizinho.
    resolver 127.0.0.11 valid=10s;
    set $upstream_hml http://web-hml;

    location / {
        proxy_pass $upstream_hml$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
