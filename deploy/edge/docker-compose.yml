# A borda: única dona das portas 80 e 443 e do certificado. Olha o domínio de
# cada requisição e entrega ao ambiente correspondente.

services:
  proxy:
    image: nginx:alpine
    container_name: fateconnect-edge
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN_PROD: ${DOMAIN_PROD}
      DOMAIN_HML: ${DOMAIN_HML}
    volumes:
      - ./nginx/${EDGE_CONF}:/etc/nginx/templates/default.conf.template:ro
      - certbot-certs:/etc/letsencrypt:ro
      - certbot-challenge:/var/www/certbot:ro
    networks:
      - edge

  # Sobe só quando chamado pelo enable-https.sh. Fora disso fica parado.
  certbot:
    image: certbot/certbot
    profiles: ['certbot']
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-challenge:/var/www/certbot

networks:
  edge:
    external: true
    name: fateconnect-edge

volumes:
  certbot-certs:
    name: fateconnect-certbot-certs
  certbot-challenge:
    name: fateconnect-certbot-challenge
