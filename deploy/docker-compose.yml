# Um ambiente completo. Sobe duas vezes, com arquivos de configuração
# diferentes: ./deploy.sh hml e ./deploy.sh prod.
# Nenhuma porta é publicada aqui — quem fala com a internet é a borda.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  conta-api:
    build:
      context: ../FateConnect/FateConnect.Api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DB_CONNECTION: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      CORS_ORIGINS: ${PUBLIC_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRACAO_HORAS: ${JWT_EXPIRACAO_HORAS}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  carona-api:
    build:
      context: ../FateConnect/Carona
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      CONECAO_POSTGRE_SQL: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      CORS_ORIGINS: ${PUBLIC_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRACAO_HORAS: ${JWT_EXPIRACAO_HORAS}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  web:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      # O front não é construído aqui: chega pronto de quem o compilou, para que
      # os source maps enviados ao Sentry descrevam exatamente este bundle.
      # Quem gera esta pasta é o workflow, ou o build-front.sh no caminho manual.
      - ./dist/${ENVIRONMENT}:/usr/share/nginx/html:ro
      - ./nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - conta-api
      - carona-api
    networks:
      internal:
      edge:
        # É por este nome que a borda encontra o ambiente, sem depender do nome
        # que o compose dá ao contêiner.
        aliases:
          - web-${ENVIRONMENT}

networks:
  # Só os serviços deste ambiente se enxergam aqui. O banco não sai daqui.
  internal:
  edge:
    external: true
    name: fateconnect-edge

volumes:
  db-data:
