# A API de um ambiente. Sobe duas vezes, com arquivos de configuração
# diferentes: ./deploy.sh hml e ./deploy.sh prod.
#
# Não há contêiner de banco nem de servidor web: PostgreSQL e nginx rodam no
# host, uma cópia só para os dois ambientes. O banco é alcançado pelo host; o
# front é servido pelo nginx do host.

# O log vai para o journal do host, que o apaga depois de 14 dias (vps-setup.sh).
# Sem o tag, a linha sai com o id do contêiner, que muda a cada deploy.
x-logging: &journald
  driver: journald
  options:
    tag: '{{.Name}}'

services:
  api:
    build:
      # A pasta de cima entra para o build ler o .editorconfig, que marca as migrations como código gerado.
      context: ../FateConnect
      dockerfile: FateConnect.Api/Dockerfile
      # O ImageSharp reprova o build de publicação sem licença. Ela entra como
      # segredo do build, que não aparece no log nem chega à imagem que sobe.
      secrets:
        - sixlabors_license
    restart: unless-stopped
    logging: *journald
    # Sem esperar a fila ficar pronta, a API sobe antes dela e falha a primeira conexão.
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DB_CONNECTION: Host=host.docker.internal;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      CORS_ORIGINS: ${PUBLIC_URL}${CORS_EXTRA_ORIGINS:+,${CORS_EXTRA_ORIGINS}}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      
      # Comunicação e E-mail
      PUBLIC_URL: ${PUBLIC_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_SENDER: ${EMAIL_SENDER}
      
      # Erros da API no Sentry: sem DSN, desligado. Ambiente e versão vêm do deploy.sh.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT}
      SENTRY_RELEASE: ${SENTRY_RELEASE}

      # Configurações do RabbitMQ
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
            
      # O coletor de servidor reserva heap por núcleo, muito acima do que esta
      # API usa. O modo estação de trabalho a mantém dentro do mem_limit.
      DOTNET_gcServer: '0'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      # Só em 127.0.0.1: quem fala com a internet é o nginx do host.
      - '127.0.0.1:${API_PORT}:8080'
    # Teto por ambiente: a API que vazar memória cai sozinha, sem levar a
    # máquina. Na subida ela passa de 170 MB.
    mem_limit: 512m
    # As imagens enviadas vivem em volume: sem ele, todo deploy recria o
    # contêiner e leva junto o que foi carregado.
    volumes:
      - api_uploads:/app/wwwroot/uploads

  rabbitmq:
    image: rabbitmq:3-management
    container_name: fateconnect_rabbitmq_${API_PORT} # Nomeia pelo ambiente para evitar colisão entre hml/prod
    restart: unless-stopped
    logging: *journald
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - '127.0.0.1:${RABBITMQ_PORT}:5672'
      - '127.0.0.1:${RABBITMQ_UI_PORT}:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    mem_limit: 512m

volumes:
  api_uploads:

secrets:
  sixlabors_license:
    environment: SIXLABORS_LICENSE