# Fica atrás da borda: sem TLS e sem nome de domínio, que são assunto dela.
server {
    listen 80;
    server_name _;

    location /api/conta/ {
        proxy_pass http://conta-api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /api/carona/ {
        proxy_pass http://carona-api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    root /usr/share/nginx/html;
    index index.html;

    # O React Router resolve as rotas no navegador: qualquer caminho que não seja
    # arquivo precisa devolver o index, senão recarregar a página dá 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
