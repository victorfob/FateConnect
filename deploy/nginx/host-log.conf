# O formato do log de acesso de todo o nginx: os sites o usam pelo nome, e o que não
# é site (servidor padrão, redirecionamento do certbot) cai no access_log daqui.
map $request_uri $fateconnect_path_without_query {
    ~^([^?]*)  $1;
}

# A página devolve o token da query no Referer dos pedidos seguintes.
map $http_referer $fateconnect_referer_without_query {
    ""         -;
    ~^([^?]*)  $1;
}

# O que não casar sai como `-`, nunca com o IP inteiro.
map $remote_addr $fateconnect_masked_addr {
    ~^(\d+\.\d+\.\d+)\.\d+$      $1.0;
    "~^((?:[0-9a-f]+:){1,3})"    $1:;
    default                      -;
}

# ⛔ `$uri` não serve no lugar do caminho: depois do `try_files`, toda rota do front
# sai como /index.html.
log_format fateconnect_masked '$fateconnect_masked_addr - $remote_user [$time_local] '
                              '"$request_method $fateconnect_path_without_query $server_protocol" '
                              '$status $body_bytes_sent '
                              '"$fateconnect_referer_without_query" "$http_user_agent"';

access_log /var/log/nginx/access.log fateconnect_masked;
